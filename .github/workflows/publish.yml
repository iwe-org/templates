name: publish

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    name: Publish templates and the index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache the cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build iwe-template
        run: cargo build --release --locked

      - name: Publish each entry that has no release
        run: scripts/publish-entries.sh

      - name: Assemble and upload the index
        run: scripts/assemble-index.sh
